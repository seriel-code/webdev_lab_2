<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Registration Form</title>
</head>

<body>

    <h1>Conference Registration Form</h1>

    <form>
        <label for="fullName">Full Name:</label><br>
        <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            required
        >

        <br><br>

        <label for="email">Email Address:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
        >

        <br><br>

        <label for="age">Age:</label><br>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="99"
            value="18"
            required
        >

        <br><br>

        <strong>Gender:</strong><br><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <br><br>

        <label for="country">
            <strong>Country of Residence:</strong>
        </label><br>

        <select id="country" name="country">
            <option value="Malaysia">Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Brunei">Brunei</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <strong>Areas of Interest:</strong><br><br>

        <input
            type="checkbox"
            id="software"
            name="interest"
            value="Software Development"
        >
        <label for="software">Software Development</label><br>

        <input
            type="checkbox"
            id="dataScience"
            name="interest"
            value="Data Science"
        >
        <label for="dataScience">Data Science</label><br>

        <input
            type="checkbox"
            id="cybersecurity"
            name="interest"
            value="Cybersecurity"
        >
        <label for="cybersecurity">Cybersecurity</label><br>

        <input
            type="checkbox"
            id="ai"
            name="interest"
            value="Artificial Intelligence"
        >
        <label for="ai">Artificial Intelligence</label>

        <br><br>

        <strong>Experience Level:</strong><br><br>

        <input
            type="radio"
            id="beginner"
            name="experience"
            value="Beginner"
        >
        <label for="beginner">Beginner</label><br>

        <input
            type="radio"
            id="intermediate"
            name="experience"
            value="Intermediate"
        >
        <label for="intermediate">Intermediate</label><br>

        <input
            type="radio"
            id="advanced"
            name="experience"
            value="Advanced"
        >
        <label for="advanced">Advanced</label>

        <br><br>

        <label for="comments">
            <strong>Comments or Questions:</strong>
        </label><br>

        <textarea
            id="comments"
            name="comments"
            rows="5"
            cols="50"
            placeholder="Any comments or questions?"
        ></textarea>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
